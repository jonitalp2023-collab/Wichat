name: Publicar CHAT ARGENTINA en Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/src/main/assets/**'
      - 'releases/**'
      - 'privacy-policy.html'
      - 'delete-account.html'
      - 'child-safety-standards.html'
      - 'legal.html'
      - '.github/workflows/pages.yml'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos y versiones OTA
        run: |
          mkdir -p site/releases
          cp -R app/src/main/assets/. site/
          # Las páginas legales de la raíz son la fuente pública vigente.
          # Sobrescribir las copias incluidas en los assets de la app.
          for file in privacy-policy.html delete-account.html child-safety-standards.html legal.html; do
            if [ -f "$file" ]; then
              cp "$file" "site/$file"
            fi
          done
          # Conservar las versiones anteriores para que las instalaciones
          # que ya guardaron una versión remota no terminen en un 404.
          if [ -d releases ]; then
            cp -R releases/. site/releases/
          fi
          VERSION=$(python3 -c 'import json; print(json.load(open("app/src/main/assets/version.json"))["version"])')
          mkdir -p "site/releases/$VERSION"
          cp -R app/src/main/assets/. "site/releases/$VERSION/"

      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Esperar a que GitHub registre el artefacto
        run: sleep 15

      - name: Publicar CHAT ARGENTINA
        id: deployment
        uses: actions/deploy-pages@v4
