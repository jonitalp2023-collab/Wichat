name: Publicar CHAT ARGENTINA en Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/src/main/assets/**'
      - '.github/workflows/pages.yml'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos y versión OTA
        run: |
          mkdir -p site
          cp -R app/src/main/assets/. site/
          VERSION=$(python3 -c 'import json; print(json.load(open("app/src/main/assets/version.json"))["version"])')
          mkdir -p "site/releases/$VERSION"
          cp -R app/src/main/assets/. "site/releases/$VERSION/"

      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar CHAT ARGENTINA
        id: deployment
        uses: actions/deploy-pages@v4
