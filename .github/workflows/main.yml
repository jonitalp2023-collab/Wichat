
name: Generar APK Wi Chat

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Mostrar archivos del proyecto
        run: |
          pwd
          find . -maxdepth 3 -type f | sort

      - name: Verificar módulos
        run: gradle projects

      - name: Ver tareas de Android
        run: gradle :app:tasks --all

      - name: Compilar Wi Chat
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Wi-Chat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
