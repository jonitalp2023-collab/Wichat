name: Validar y compilar ChatArgentina

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release-readiness-android
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar y analizar Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar plataforma y herramientas Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validar JavaScript de ChatArgentina
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?![^>]*src=)[^>]*>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("No se encontró JavaScript inline para validar")
          Path("/tmp/chatargentina-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/chatargentina-inline.js

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK, AAB y ejecutar Lint
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease :app:lintDebug --stacktrace

      - name: Guardar artefactos de prueba
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChatArgentina-Android-candidatos
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
