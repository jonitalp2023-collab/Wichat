name: Validar y compilar ChatArgentina

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release-readiness-android
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar y analizar Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar plataforma y herramientas Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validar JavaScript de ChatArgentina
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?![^>]*src=)[^>]*>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("No se encontró JavaScript inline para validar")
          Path("/tmp/chatargentina-inline.js").write_text(chr(10).join(scripts), encoding="utf-8")
          PY
          node --check /tmp/chatargentina-inline.js

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar firma Android
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Firma no configurada; no se generará un APK de publicación."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chatargentina-release.jks"
          chmod 600 "$RUNNER_TEMP/chatargentina-release.jks"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/chatargentina-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Compilar APK debug y ejecutar Lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug --stacktrace

      - name: Compilar APK y AAB release firmados
        if: steps.signing.outputs.available == 'true'
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Guardar artefactos Android
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChatArgentina-Android-candidatos
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
