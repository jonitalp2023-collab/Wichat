name: Generar APK Wi Chat

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estructura
        run: |
          test -f App/build.gradle.kts
          test -f App/src/main/AndroidManifest.xml
          test -f App/src/main/assets/index.html

      - name: Compilar Wi Chat
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Wi-Chat-APK
          path: App/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
