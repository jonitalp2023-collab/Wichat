
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wi Chat</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10111b;color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#191b2b;padding:20px;
 text-align:center;border-bottom:1px solid #303249;
}
header h1{margin:0;color:#8b7cff}
header p{margin:6px 0 0;color:#aaa;font-size:13px}
#login{padding:25px;text-align:center;margin-top:80px}
input{
 width:100%;padding:15px;border-radius:12px;
 border:1px solid #393b50;background:#202235;
 color:white;font-size:16px;margin:10px 0;
}
button{
 background:#7965ff;color:white;border:0;
 padding:14px;border-radius:12px;
 font-weight:bold;font-size:15px;cursor:pointer;
}
#login button{width:100%}
#chat{display:none}
#status{padding:12px;color:#a99cff;text-align:center}
#messages{
 height:calc(100dvh - 220px);
 overflow-y:auto;padding:15px;
}
.msg{
 background:#202235;padding:12px;
 border-radius:12px;margin-bottom:10px;
 overflow-wrap:anywhere;
}
.name{color:#a99cff;font-weight:bold}
.time{font-size:10px;color:#888;float:right}
#sendbox{
 display:flex;gap:8px;padding:10px;
 background:#191b2b;
 position:sticky;bottom:0;
}
#sendbox input{margin:0;min-width:0}
#sendbox button{padding:12px}
#admin{padding:10px;text-align:center}
.small{font-size:12px;color:#888}
</style>
</head>
<body>

<header>
<h1>Wi Chat</h1>
<p>Conectate y conocé gente</p>
</header>

<div id="login">
<h2>¡Bienvenido!</h2>
<p>Elegí tu apodo para entrar a la sala general.</p>
<input id="nickname" maxlength="20" placeholder="Tu apodo">
<button onclick="enterChat()">ENTRAR AL CHAT</button>
<p class="small">Sin registro. Entrá y conversá.</p>
</div>

<div id="chat">
<div id="status">🟢 Sala general</div>
<div id="messages">
<div class="msg">¡Bienvenido a Wi Chat! 👋</div>
</div>
<div id="sendbox">
<input id="message" maxlength="500" placeholder="Escribí un mensaje...">
<button onclick="sendMessage()">ENVIAR</button>
</div>
<div id="admin"></div>
</div>

<script>
let nickname="";

function enterChat(){
 const n=document.getElementById("nickname").value.trim();
 if(!n){alert("Escribí un apodo");return}
 nickname=n;
 document.getElementById("login").style.display="none";
 document.getElementById("chat").style.display="block";
 document.getElementById("status").textContent="🟢 Sala general · "+nickname;
}

function sendMessage(){
 const input=document.getElementById("message");
 const value=input.value.trim();
 if(!value)return;

 const box=document.getElementById("messages");
 const msg=document.createElement("div");
 msg.className="msg";

 const name=document.createElement("span");
 name.className="name";
 name.textContent=nickname;

 const time=document.createElement("span");
 time.className="time";
 time.textContent=new Date().toLocaleTimeString();

 const content=document.createElement("div");
 content.textContent=value;

 msg.append(name,time,content);
 box.appendChild(msg);
 box.scrollTop=box.scrollHeight;
 input.value="";
}

document.getElementById("message").addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});
</script>
</body>
</html>
