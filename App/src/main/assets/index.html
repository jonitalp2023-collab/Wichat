
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b1020;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#121a30;
 padding:18px;
 text-align:center;
 border-bottom:1px solid #273451;
}
header h1{margin:0;color:#55b8ff}
header p{margin:6px 0 0;color:#9baac5}
.container{max-width:650px;margin:auto;padding:15px}
.panel{
 background:#141e35;
 padding:20px;
 border-radius:15px;
 margin-top:25px;
}
input{
 width:100%;
 padding:15px;
 border:1px solid #344361;
 border-radius:10px;
 background:#0c1427;
 color:white;
 font-size:16px;
 margin:8px 0;
}
button{
 border:0;
 padding:13px 18px;
 border-radius:10px;
 background:#168bea;
 color:white;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.5}
#chat{display:none}
#messages{
 height:55vh;
 overflow-y:auto;
 background:#0c1427;
 border-radius:12px;
 padding:12px;
 margin:15px 0;
}
.message{
 background:#1b2945;
 padding:10px;
 border-radius:10px;
 margin-bottom:10px;
 overflow-wrap:anywhere;
}
.nickname{color:#55b8ff;font-weight:bold}
.time{font-size:11px;color:#8293b1}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.status{color:#70dca1;font-size:13px}
</style>
</head>

<body>

<header>
<h1>Wi Chat</h1>
<p>La comunidad donde todos pueden hablar</p>
</header>

<div class="container">

<div id="login" class="panel">
<h2>Bienvenido a Wi Chat</h2>
<p>Elegí tu apodo para entrar a la sala general.</p>
<input id="nickname" maxlength="25"
placeholder="Escribí tu apodo">
<button id="enterBtn" onclick="enterChat()">ENTRAR AL CHAT</button>
<p id="error" style="color:#ff7777"></p>
</div>

<div id="chat">
<div class="panel">
<h3>🌎 Sala general</h3>
<p class="status" id="status">Conectando...</p>
<div id="messages"></div>

<div class="row">
<input id="messageInput" maxlength="1000"
placeholder="Escribí un mensaje..."
onkeydown="if(event.key==='Enter')sendMessage()">
<button id="sendBtn" onclick="sendMessage()">Enviar</button>
</div>

<br>
<button onclick="exitChat()" style="background:#bd394d">
Salir del chat
</button>
</div>
</div>

</div>

<script>
const SUPABASE_URL =
"https://pqnnzkqxkndzelsbtxvv.supabase.co";

// PEGÁ AQUÍ TU CLAVE PUBLICABLE (anon)
// Nunca uses la clave secret o service_role.
const SUPABASE_KEY = "PEGAR_AQUI_TU_CLAVE_PUBLICABLE";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let nickname = "";
let channel = null;

async function enterChat(){
 const name = document.getElementById("nickname").value.trim();
 const error = document.getElementById("error");

 if(!name){
  error.textContent = "Escribí un apodo.";
  return;
 }

 if(SUPABASE_KEY === "PEGAR_AQUI_TU_CLAVE_PUBLICABLE"){
  error.textContent = "Falta configurar la clave pública de Supabase.";
  return;
 }

 nickname = name;
 document.getElementById("enterBtn").disabled = true;

 const {error: testError} = await db
  .from("messages")
  .select("id")
  .limit(1);

 if(testError){
  error.textContent = "Error de conexión: " + testError.message;
  document.getElementById("enterBtn").disabled = false;
  return;
 }

 document.getElementById("login").style.display = "none";
 document.getElementById("chat").style.display = "block";

 await loadMessages();
 subscribeMessages();
}

async function loadMessages(){
 const box = document.getElementById("messages");

 const {data,error} = await db
  .from("messages")
  .select("id,nickname,content,created_at")
  .order("created_at",{ascending:true})
  .limit(100);

 if(error){
  document.getElementById("status").textContent =
   "Error cargando mensajes";
  return;
 }

 box.innerHTML = "";

 data.forEach(addMessage);
 box.scrollTop = box.scrollHeight;

 document.getElementById("status").textContent =
  "● Conectado a la sala general";
}

function addMessage(msg){
 const box = document.getElementById("messages");
 const div = document.createElement("div");
 div.className = "message";

 const name = document.createElement("div");
 name.className = "nickname";
 name.textContent = msg.nickname;

 const content = document.createElement("div");
 content.textContent = msg.content;

 const time = document.createElement("div");
 time.className = "time";
 time.textContent = msg.created_at
  ? new Date(msg.created_at).toLocaleTimeString("es-AR",
    {hour:"2-digit",minute:"2-digit"})
  : "";

 div.append(name,content,time);
 box.appendChild(div);
 box.scrollTop = box.scrollHeight;
}

async function sendMessage(){
 const input = document.getElementById("messageInput");
 const btn = document.getElementById("sendBtn");
 const content = input.value.trim();

 if(!content) return;

 btn.disabled = true;

 const {error} = await db
  .from("messages")
  .insert({
   nickname:nickname,
   content:content
  });

 if(error){
  alert("No se pudo enviar: " + error.message);
 }else{
  input.value = "";
 }

 btn.disabled = false;
 input.focus();
}

function subscribeMessages(){
 channel = db
  .channel("wi-chat-messages")
  .on(
   "postgres_changes",
   {
    event:"INSERT",
    schema:"public",
    table:"messages"
   },
   payload=>{
    addMessage(payload.new);
   }
  )
  .subscribe();
}

async function exitChat(){
 if(channel){
  await db.removeChannel(channel);
  channel = null;
 }

 document.getElementById("chat").style.display = "none";
 document.getElementById("login").style.display = "block";
 document.getElementById("nickname").value = nickname;
 document.getElementById("enterBtn").disabled = false;
 document.getElementById("messages").innerHTML = "";
}

</script>
</body>
</html>
